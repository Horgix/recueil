name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-binary:
    name: Build binary (static musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install musl tools
        run: sudo apt-get install -y musl-tools

      - name: Add musl target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Cache dependencies
        uses: actions/cache@v5
        env:
          cache-name: cache-rust-crates-musl-v1 # Manually bump this to force a full rebuild of de pendencies while not changing the Cargo.lock file
        with:
          path: |
            ./target/x86_64-unknown-linux-musl/release/build
            ./target/x86_64-unknown-linux-musl/release/deps
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('./Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - run: cargo fetch # Dedicated step for better insights in observed Actions runs
      - run: cargo build --release --all-features --target x86_64-unknown-linux-musl

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: index-webhook-x86_64-linux-musl
          path: target/x86_64-unknown-linux-musl/release/index-webhook
          if-no-files-found: error

  docker:
    name: Build and push Docker image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [build-binary, docker]
    permissions:
      contents: write
    steps:
      - name: Download binary artifact
        uses: actions/download-artifact@v8
        with:
          name: index-webhook-x86_64-linux-musl
          path: artifacts/

      - name: Make binary executable
        run: chmod +x artifacts/index-webhook

      - name: Create release and attach binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes \
            "artifacts/index-webhook#index-webhook-x86_64-linux-musl"

      - name: Prepend Docker image reference to release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION_NO_V="${VERSION#v}"

          CURRENT_NOTES=$(gh release view "$VERSION" --json body -q .body)

          {
            echo "## Docker Image"
            echo ""
            echo '```'
            echo "docker pull ghcr.io/${{ github.repository }}:${VERSION_NO_V}"
            echo '```'
            echo ""
            echo "---"
            echo ""
            echo "${CURRENT_NOTES}"
          } > updated-notes.md

          gh release edit "$VERSION" --notes-file updated-notes.md
